services:
  inference:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./predictions.csv:/app/predictions.csv

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.21.3
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db
    command: mlflow server --host 0.0.0.0 --port 5000

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

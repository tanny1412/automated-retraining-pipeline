apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus-datasource
        url: http://prometheus-service:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
data:
  alert-rules.yml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: ML Pipeline Alerts
        folder: ML Pipeline
        interval: 1m
        rules:
          - uid: confidence-drop-alert
            title: Low Prediction Confidence
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus-datasource
                model:
                  expr: avg_over_time(prediction_confidence[5m])
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
                  settings:
                    mode: ""
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: lt
                        params:
                          - 0.70
                      query:
                        params:
                          - B
                      reducer:
                        type: last
                        params: []
                      type: query
            noDataState: NoData
            execErrState: Error
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Prediction confidence dropped below 0.70"
              description: "Average prediction confidence over the last 5 minutes is below 0.70 — model may be degrading."
  notification-policies.yml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: Slack Alerts
  contact-points.yml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Slack Alerts
        receivers:
          - uid: slack-receiver
            type: slack
            settings:
              url: {{ .Values.grafana.slackWebhookUrl }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana-container
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.adminPassword | quote }}
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-alerting
              mountPath: /etc/grafana/provisioning/alerting

      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-alerting
          configMap:
            name: grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000

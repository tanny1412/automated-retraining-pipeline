apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
type: Opaque
stringData:
  contact-points.yml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Slack Alerts
        receivers:
          - uid: slack-receiver
            type: slack
            settings:
              url: {{ .Values.grafana.slackWebhookUrl }}

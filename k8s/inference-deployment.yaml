apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-app
  template:
    metadata:
      labels:
        app: inference-app
    spec:
      initContainers:
        - name: model-loader
          image: amazon/aws-cli:latest
          command:
            - sh
            - -c
            - aws s3 cp s3://${S3_BUCKET}/models/ /app/models/ --recursive
          env:
            - name: S3_BUCKET
              value: "ml-pipeline-models-tanish"
          volumeMounts:
            - name: models-volume
              mountPath: /app/models
      containers:
        - name: inference-container
          image: 354578186384.dkr.ecr.us-east-1.amazonaws.com/ml-pipeline-inference:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
            - name: MODEL_NAME
              value: "distilbert-base-uncased"
            - name: NUM_LABELS
              value: "2"
            - name: LABEL_MAP
              value: '{"0": "negative", "1": "positive"}'
            - name: MAX_LENGTH
              value: "128"
            - name: MAX_BATCH_SIZE
              value: "32"
            - name: MLFLOW_MODEL_NAME
              value: "sentiment-classifier"
            - name: DATASET_NAME
              value: "sst2"
            - name: TEXT_COLUMN
              value: "sentence"
            - name: VAL_SPLIT
              value: "validation"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          volumeMounts:
            - name: models-volume
              mountPath: /app/models
      volumes:
        - name: models-volume
          persistentVolumeClaim:
            claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inference-service
spec:
  type: LoadBalancer
  selector:
    app: inference-app
  ports:
    - port: 8000
      targetPort: 8000

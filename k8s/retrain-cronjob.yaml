apiVersion: batch/v1
kind: CronJob
metadata:
  name: retrain-cronjob
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: retrain
              image: 354578186384.dkr.ecr.us-east-1.amazonaws.com/ml-pipeline-training:latest
              imagePullPolicy: Always
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: DATABASE_URL
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow-service:5000"
              resources:
                requests:
                  memory: "6Gi"
                  nvidia.com/gpu: "1"
                limits:
                  memory: "6Gi"
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: models
                  mountPath: /app/models

          nodeSelector:
            nvidia.com/gpu: "true"
          restartPolicy: OnFailure
          volumes:
            - name: models
              persistentVolumeClaim:
                claimName: models-pvc

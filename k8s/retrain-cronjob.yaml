apiVersion: batch/v1
kind: CronJob
metadata:
  name: retrain-cronjob
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: retrain
              image: 354578186384.dkr.ecr.us-east-1.amazonaws.com/ml-pipeline-inference:latest
              imagePullPolicy: Always
              command: ["python", "retrain_if_needed.py"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: "250m"
                  memory: "1Gi"
                limits:
                  cpu: "500m"
                  memory: "3Gi"
              volumeMounts:
                - name: models
                  mountPath: /app/models

          restartPolicy: OnFailure
          volumes:
            - name: models
              persistentVolumeClaim:
                claimName: models-pvc
